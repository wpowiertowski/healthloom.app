# CodeQL advanced setup (Swift + Actions).
#
# WHY THIS FILE EXISTS (round-6 CI fix): CodeQL *default* setup runs on
# macos-latest, whose image rotated post-GA (Xcode 27 beta removed; the
# default is now Xcode_26.6). Our deployment target is iOS 27.0, so
# default setup's autobuild drove Xcode_26.6's iPhoneOS26.5 SDK at an
# arm64-apple-ios27.0 target and failed environmentally ("no such module
# CoreModel", manifest minimum-target noise) — not a code finding. This
# advanced setup pins the same `xcode-27` preview image + explicit
# xcode-select the app job in ci.yml uses, so analysis builds with the
# Xcode that can actually target iOS 27.
#
# Coverage parity with the default setup it replaces: languages
# swift+actions, default query suite (no `queries:` override), weekly
# scheduled run plus push/PR. The coordinator disables default setup via
# API AFTER this file lands (sequencing: advanced must exist first).
#
# TOOLCHAIN NOTE (carried from ci.yml): once Xcode 27 GA lands on the
# regular macos-26 image, move this job back to macos-26 (WP-38
# toolchain-finalization checklist item).

name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    # Weekly, matching the default-setup cadence this replaces.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (swift, actions)
    # Same preview image as ci.yml's app job: the only image whose Xcode
    # targets iOS 27. See the toolchain note at the top of this file.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 27
        # Select explicitly (same rationale as ci.yml's app job): the
        # image default could bump and silently change what we analyze.
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Show Xcode version
        run: xcodebuild -version

      # Resolve the local packages BEFORE CodeQL starts tracing, with the
      # SwiftPM manifest sandbox off. Under the tracer (DYLD_INSERT_LIBRARIES
      # = libtrace.dylib) SwiftPM's spawn of /usr/bin/sandbox-exec to
      # evaluate each Package.swift fails with EBADARCH -- "posix_spawn
      # error: Bad CPU type in executable (86)" for all five packages,
      # before anything compiles. It was an occasional flake that cleared
      # on re-run (PR #51), then failed twice in a row on PR #53 after the
      # runner image moved 20260912 -> 20260921 and the CodeQL bundle
      # 2.27.0 -> 2.27.1. Not spawning sandbox-exec under the tracer at all
      # removes the dependency on either version.
      - name: Resolve Swift packages (untraced)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HealthLoom.xcodeproj -scheme HealthLoom \
            -IDEPackageSupportDisableManifestSandbox=YES

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift, actions

      # Explicit build in place of `autobuild`, so the traced xcodebuild
      # also runs with the manifest sandbox off. Commands between init and
      # analyze are traced for Swift; Actions needs no build. Signing off:
      # analysis needs compilation, not an installable app.
      - name: Build for analysis
        run: |
          xcodebuild build \
            -project HealthLoom.xcodeproj -scheme HealthLoom \
            -destination 'generic/platform=iOS Simulator' \
            -IDEPackageSupportDisableManifestSandbox=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
