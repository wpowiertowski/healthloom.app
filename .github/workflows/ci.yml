name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# Cancel in-progress runs for the same PR/branch -- prevents queuing multiple
# expensive macOS builds when commits are pushed rapidly (matches the
# convention in the sibling lumivault.app project).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# iOS 27 retarget (2026-07): local dev is on the Xcode 27 beta / Swift 6.4.
# GitHub now ships the beta on a dedicated preview image with the `xcode-27`
# runs-on label (actions/runner-images#14196), which the app job uses below.
# Package jobs stay on macos-26 pinned to an Xcode 26.x that IS on that
# image -- `swift test` builds for the macOS host, and the manifests
# deliberately stay at swift-tools-version 6.2, so those jobs don't need the
# preview image (see implementation-plan.md "Toolchain note").
# Available versions:
# https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
env:
  XCODE_VERSION: "26.4.1"
  # Pinned so the project-drift job compares against a fixed generator —
  # see the comment on that job. Keep in lockstep with the version used
  # locally and with the committed HealthLoom.xcodeproj.
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  # WP-38 launch gates: repo-wide source guards that fail fast on
  # ubuntu (no Xcode needed). Each grep below is scoped to production
  # Swift sources (docs, reviews, and tests may legitimately mention
  # these strings — e.g. a test asserting the new endpoint — so they
  # are excluded; see the per-rule comments).
  launch-guards:
    name: launch-gate source guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: No legacy Fitbit Web API calls
        # The Fitbit Web API sunsets September 2026; all traffic must go
        # through the Google Health Connect REST API (health.googleapis.com).
        # Excludes Tests (a test may name the legacy host to assert against
        # it) and markdown (changelog/progress history). Matches any
        # fitbit.com host (third-party F9): the legacy OAuth dance lived on
        # www.fitbit.com, not just api.fitbit.com.
        #
        # Non-vacuous by construction (third-party F2): `grep` exits 2 on
        # a missing path, which `if` treats as false and would pass an
        # empty tree — so the scope dirs are asserted to exist first, and
        # any rc >= 1 fails the step (1 = match found, 2+ = grep error).
        run: |
          set -euo pipefail
          for dir in Packages/CoreModel/Sources Packages/Secrets/Sources Packages/GoogleHealthClient/Sources Packages/SyncKit/Sources Packages/CoachKit/Sources HealthLoomApp; do
            test -d "$dir" || { echo "guard scope dir missing: $dir" >&2; exit 1; }
          done
          # grep rc: 0 = match, 1 = clean, 2+ = error — only 1 passes.
          rc=0
          # Spelling ladder (third-party N2): the YAML block scalar passes
          # `\\` through untouched, the shell's double quotes collapse it
          # to `\`, and grep -E receives `fitbit\.com` — a literal dot.
          # A single `\` here would reach grep as `\.com`... i.e. still
          # correct by luck; the double is what makes it deliberate.
          grep -rn -E "fitbit\\.com" --include='*.swift' Packages/*/Sources HealthLoomApp || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "legacy Fitbit reference found (or grep failed: rc=$rc)" >&2
            exit 1
          fi
          echo "no legacy Fitbit references"

      - name: No Claude server tools in any code path
        # BYO-key tiers are chat-only with no tool use; server-side tool
        # execution must never appear (both known spellings). Same
        # production-only scope as above. Non-vacuous guard: same
        # dir-exists + rc>=1 pattern as the Fitbit step (third-party F2).
        # Structural companion (third-party F10): the Claude ping body is
        # built by `ClaudeMessageRequest`, whose type admits no tools
        # field — see CloudKeyValidatorTests' wire-format test, which is
        # the assertion with teeth; this grep is the tripwire.
        run: |
          set -euo pipefail
          for dir in Packages/CoreModel/Sources Packages/Secrets/Sources Packages/GoogleHealthClient/Sources Packages/SyncKit/Sources Packages/CoachKit/Sources HealthLoomApp; do
            test -d "$dir" || { echo "guard scope dir missing: $dir" >&2; exit 1; }
          done
          # grep rc: 0 = match, 1 = clean, 2+ = error — only 1 passes.
          rc=0
          grep -rn -E "serverTools|server_tools" --include='*.swift' Packages/*/Sources HealthLoomApp || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "Claude server-tools reference found (or grep failed: rc=$rc)" >&2
            exit 1
          fi
          echo "no Claude server-tools references"

      - name: Display name is HealthLoom (bundle + HealthKit attribution)
        # The HealthKit source attribution derives from the bundle display
        # name; a rename here silently rebrands every sample the app wrote.
        # (App Store Connect listing itself is a human checklist item.)
        # Anchored extraction (third-party F4): an unanchored substring
        # grep would pass on a comment mentioning the name. python3 +
        # plistlib because this job runs on ubuntu (no plutil there).
        run: |
          set -euo pipefail
          name=$(python3 -c "import plistlib; print(plistlib.load(open('HealthLoomApp/Info.plist','rb'))['CFBundleDisplayName'])")
          if [ "$name" != "HealthLoom" ]; then
            echo "CFBundleDisplayName is '$name', expected 'HealthLoom'" >&2
            exit 1
          fi
          grep -q 'CFBundleDisplayName: HealthLoom' project.yml
          echo "display name consistent"

      - name: Bundle ID is app.healthloom
        # A bundle-ID drift silently orphans HealthKit attribution, the
        # App Store listing, and the bundle-bound Google OAuth client.
        run: |
          set -euo pipefail
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: app.healthloom' project.yml
          echo "bundle ID consistent"

  packages:
    name: swift test (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [CoreModel, Secrets, GoogleHealthClient, SyncKit, CoachKit]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache SwiftPM and SourcePackages
        uses: actions/cache@v5
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            Packages/${{ matrix.package }}/.build
          key: ${{ runner.os }}-swiftpm-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-${{ matrix.package }}-

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        # Warnings fail the build: CI must go red on warnings.
        run: swift test -Xswiftc -warnings-as-errors

  # Xcode Cloud repo-prep (LumiVault pattern): Xcode Cloud builds from the
  # committed project and has no XcodeGen step, so the .xcodeproj must be
  # in the repo and must match project.yml. This job regenerates with the
  # pinned generator and fails on any drift.
  project-drift:
    name: XcodeGen Drift
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Toolchain-independent guard: even if the regeneration below has to
      # be skipped for an XcodeGen upgrade, the strictness setting stays
      # fenced — a committed project without warnings-as-errors would let
      # Xcode Cloud ship warnings the local build rejects.
      - name: Assert committed project carries warnings-as-errors
        run: |
          if ! grep -q -- 'SWIFT_TREAT_WARNINGS_AS_ERRORS = YES' HealthLoom.xcodeproj/project.pbxproj; then
            echo "::error::Committed project.pbxproj is missing SWIFT_TREAT_WARNINGS_AS_ERRORS."
            echo "Run 'xcodegen generate' and commit the result."
            exit 1
          fi

      # Pinned rather than `brew install xcodegen`, because this job
      # compares generated output byte-for-byte. On an unpinned install,
      # any XcodeGen release that changes that output turns every
      # unrelated PR red — and the failure tells the author to commit a
      # regenerated project, which would then break everyone still on the
      # old version. With the version fixed, a drift failure means what it
      # says. The checksum makes the pin tamper-evident: this tool
      # generates the project the App Store build is compiled from.
      #
      # Bump XCODEGEN_VERSION and XCODEGEN_SHA256 together, in the same
      # commit as the project regenerated with that version.
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify XcodeGen version
        run: |
          actual="$(xcodegen --version | awk '{print $NF}')"
          echo "xcodegen reports: $actual (pinned: $XCODEGEN_VERSION)"
          if [ "$actual" != "$XCODEGEN_VERSION" ]; then
            echo "::error::Expected XcodeGen $XCODEGEN_VERSION, got $actual"
            exit 1
          fi

      - name: Regenerate project from project.yml
        run: xcodegen generate

      # `git status --porcelain`, not `git diff`: regenerating can *add*
      # files (a new shared scheme under xcshareddata/xcschemes/ when a
      # target or scheme is added to project.yml), and `git diff` is blind
      # to untracked paths — so the drift this job exists to catch would
      # pass unnoticed and Xcode Cloud would build from a project missing
      # that scheme.
      - name: Fail if the committed project drifted
        run: |
          drift="$(git status --porcelain -- HealthLoom.xcodeproj)"
          if [ -n "$drift" ]; then
            echo "::error::HealthLoom.xcodeproj is out of date with project.yml."
            echo "Run 'xcodegen generate' (XcodeGen ${XCODEGEN_VERSION}) and commit the result."
            echo "$drift"
            git diff -- HealthLoom.xcodeproj
            exit 1
          fi
          echo "OK: committed project matches project.yml."

  app:
    name: xcodebuild build test (HealthLoom scheme)
    # The app targets iOS 27, which needs the Xcode 27 beta's SDK. That ships
    # on GitHub's dedicated `xcode-27` preview image (arm64, macOS 26.5;
    # Xcode 27.0 beta is the image default), not on macos-26:
    # https://github.com/actions/runner-images/blob/releases/xcode-27/20260715/images/macos/xcode-27-Readme.md
    # Once Xcode 27 GA lands on the regular macos-26 image, move this job back
    # there (WP-38 toolchain-finalization checklist item).
    runs-on: xcode-27
    needs: packages
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache SwiftPM and SourcePackages
        uses: actions/cache@v5
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-swiftpm-app-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-app-

      - name: Select Xcode 27
        # Xcode 27.0 beta is the image default, but select it explicitly so a
        # future default bump on the preview image can't silently change what
        # we build with.
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select and pre-boot an iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          # Prefer the largest iPhone model available, deterministically,
          # instead of `head -n1` of whatever simctl lists first: the UI
          # tests' scroll-into-view assertions depend on what fits above the
          # fold, so an arbitrary (possibly small) device made CI diverge
          # from local runs. Whichever iOS runtime the runner's Xcode ships
          # is fine as long as it satisfies the deploymentTarget (27.0).
          udid=""
          for name in "iPhone 17 Pro Max" "iPhone 17 Pro" "iPhone 17" "iPhone"; do
            udid=$(xcrun simctl list devices available \
              | grep -F "$name" \
              | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' \
              | head -n1) && [ -n "$udid" ] && break
          done
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator found on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator: $(xcrun simctl list devices available | grep -F "$udid")"
          # Kick off the boot now, without waiting, so springboard warms up
          # while xcodegen and the ~5 min build below run. Launching the
          # first UI-tested app on a cold-booting simulator timed out at
          # xcodebuild's launch deadline ("Timed out while launching
          # application via Xcode", PR #7 run 2) -- the simulator only
          # started booting when the first test asked it to.
          xcrun simctl boot "$udid" 2>/dev/null || true
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project (xcodegen)
        run: |
          set -euo pipefail
          # xcodegen ships via Homebrew on GitHub's macOS runners; project.yml
          # is the committed source of truth, the .xcodeproj itself is not
          # committed here (unlike lumivault.app, which commits its .xcodeproj
          # directly -- HealthLoom deliberately regenerates it in CI instead,
          # to avoid .pbxproj merge conflicts across parallel work streams).
          brew install xcodegen
          xcodegen generate

      - name: Wait for simulator boot to finish
        # Usually instant -- the boot started before the build. `-b` boots
        # first if the earlier async boot somehow didn't stick.
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Build + test HealthLoom scheme
        run: |
          set -euo pipefail
          dest="platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          # The XCUITest suite runs here again (2026-07). It used to be
          # skipped wholesale with -skip-testing:HealthLoomUITests because the
          # iOS 27 beta 3 runtime on this image does not deliver
          # XCUITest-synthesized taps to the out-of-process HealthKit
          # permission sheet (com.apple.HealthPrivacyService), so the
          # onboarding test could never get past the Health Access sheet --
          # full diagnosis in PR #7. That one test now skips *itself*
          # (`XCTSkipUnless` in OnboardingUITests.swift), so the blanket flag
          # is no longer needed and the other four UI tests -- Dashboard x2,
          # Activities, Today -- get to run on the runner for the first time.
          #
          # Deliberately NOT re-adding a narrowed
          # -skip-testing:HealthLoomUITests/OnboardingUITests: that would be a
          # second mechanism skipping the same test, and the dangerous
          # direction is subtle -- whoever deletes the XCTSkip once a newer
          # beta lands would get a green CI that silently never ran the test.
          # One skip, in the test, where its reason already lives.
          # Owner directive: strict warnings-as-errors everywhere (mirrors
          # `make test`). Per-target project.yml settings cover GUI builds;
          # the command-line flags cover the xcodebuild graph including
          # local packages. No remote package dependencies remain, so no
          # third-party warnings can break this (WP-33's snapshot tests use
          # a local helper for exactly this reason).
          xcodebuild build test \
            -project HealthLoom.xcodeproj \
            -scheme HealthLoom \
            -destination "$dest" \
            -resultBundlePath "$RUNNER_TEMP/HealthLoom.xcresult" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      # UI-test failures are near-impossible to diagnose from stdout alone
      # (element-not-found waits log no hierarchy; the accessibility
      # snapshots and screenshots land in the result bundle) -- keep the
      # bundle when the job fails.
      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: HealthLoom.xcresult
          path: ${{ runner.temp }}/HealthLoom.xcresult
          if-no-files-found: ignore
